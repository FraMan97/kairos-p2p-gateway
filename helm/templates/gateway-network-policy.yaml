apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: gateway-ingress-policy
spec:
  podSelector:
    matchLabels:
      app: kairos-gateway
  policyTypes:
    - Ingress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: kairos-frontend
        - podSelector:
            matchLabels:
              app: kairos-unlocker
      ports:
        - protocol: TCP
          port: 3000